name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    name: Original tests — Python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: ruff check starships.py aggregations.py verify.py sql_extension.py run_demo.py tests/
      - run: ruff format --check starships.py aggregations.py verify.py sql_extension.py run_demo.py tests/
      - run: python -m unittest discover -s tests -v
  demo:
    name: Original full demo — real MongoDB
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7.0
        ports: ["27017:27017"]
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 5s --health-timeout 5s --health-retries 12
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - run: python -m pip install -r requirements.txt
      - name: Run original import, 12 aggregations, verification, SQL export and 15 tests
        run: python run_demo.py
      - name: Repeat the original demo to check reruns
        run: python run_demo.py
